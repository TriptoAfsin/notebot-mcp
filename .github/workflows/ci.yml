name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Validate skill
        run: |
          test "$(sed -n 2p skill/butex-notebot/SKILL.md)" = "name: butex-notebot"
          grep -qE 'butex-notebot skill version: [0-9]+\.[0-9]+\.[0-9]+' skill/butex-notebot/SKILL.md
          python3 -m py_compile skill/butex-notebot/scripts/check_update.py
